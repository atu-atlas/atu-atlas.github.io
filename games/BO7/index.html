## DVARs

Multi-purpose commands
- `setgamemode mp;xstartprivateparty;luiOpenMenu privatematchlobby;xstartlobby_patched`
Multiplayer private match trigger.
- `r_dof_enable`
This will enable/disable depth of field (0-1)
- `lui_cod_points_enabled`
This will show/hide COD Points on menus, enabled by default (0-1)
- `lui_store_disabled`
This will show/hide the store on menus, disabled by default (0-1)
- `current_season`
This will set the current season, (0-6), 0 will disable blackcell & battlepass.
- `set player_sustainammo 1`
Infinite ammo, 0-1, disabled by default.

## Inventories

- `setStorageFile "sat_mp_loadouts_private" "loadouts" 0 "name"`
Loadout name, ex: *setStorageFile "sat_mp_loadouts_private" "loadouts" 0 "name" "Fist of iron"*
- `setStorageFile "sat_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "weaponlootid"`
Weapon setup, ex: *setStorageFile "sat_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "weaponlootid" 88933*
- `setStorageFile "sat_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "camoLootID"`
Weapon setup camouflage, ex: *setStorageFile "sat_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "camoLootID" 105203*

## Zombies
<img src="/assets/images/key-art/BO7-Zombies.jpg">

*"Welcome... to the party."*

### DVARs

- `setgamemode zm;xstartprivateparty;luiOpenMenu zmpubliclobby;xstartlobby_patched`
Zombie match trigger.
- `setgametype`
Select a zombie game type.
- `uimapname`
Set the zombie map.
- `set enable_rampage_inducer`
Enable/disable Rampage Inducer, 0-1, disabled by default.
- `set zombie_cheat`
This will enable a developer cheat for all players with high value loot, depending on the number, 0-3.
- `force_unlock_zm_augments`
Force unlock all zombie augments, 0-1, disabled by default.
- `set enable_ee_headphones`
Enable/disable easter egg songs triggers, 0-1, disabled by default.
- `set ammorestockcooldown`
Enable/disable ammo box cooldown, 0-1, disabled by default.
- `set lui_ztron_hud_enabled 1`
Enable Dead Ops Arcade 4 HUD, needs to be enabled it before the match.
- `set enable_ncfd_pedestal 1`
Enable Void Claw pedestals on Rex Infernus, needs to be enabled it before the match.
