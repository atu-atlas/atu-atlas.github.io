## Menus
Useful & interesting menus
- `luiOpenMenu mainlockoutmenu`
**<img src="/assets/images/in-game/cerberus/mainmenu.png"> Main menu**
- `luiopenmenu customizemenu`
**<img src="/assets/images/in-game/cerberus/customizemenu.png"> Customization menu**
Unused leftover customization menu, sub-menus are inventory dependent.
- `luiopenmenu frontendcameramover`
**<img src="/assets/images/in-game/cerberus/frontendcameramover.png"> Frontend Camera Mover**
Camera control menu for frontend scenes.
- `luiopenmenu solooperatorselect`
**<img src="/assets/images/in-game/cerberus/solooperatorselect.png"> Solo Operator Select**
Operator selection menu without factions, for Warzone 2.0.

## DVARs
Multi-purpose commands
- `setgamemode mp;xstartprivateparty;luiOpenMenu privatematchlobby;xstartlobby_patched`
Multiplayer private match trigger.
- `r_dof_enable`
This will enable/disable depth of field (0-1)
- `lui_cod_points_enabled`
This will show/hide COD Points on menus (0-1)

## Inventories
- `setStorageFile "cerberus_mp_loadouts_private" "loadouts" 0 "name"`
Loadout name, ex: *setStorageFile "cerberus_mp_loadouts_private" "loadouts" 0 "name" "Fist of iron"*
- `setStorageFile "cerberus_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "weaponlootid"`
Weapon setup, ex: *setStorageFile "cerberus_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "weaponlootid" 35282*
- `setStorageFile "cerberus_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "camoLootID"`
Weapon setup camouflage, ex: *setStorageFile "cerberus_mp_loadouts_private" "loadouts" 0 "weaponSetups" 0 "camoLootID" 72158*
