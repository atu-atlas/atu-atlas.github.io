## Menus
Useful & interesting menus
- `luiOpenMenu mainlockoutmenu`
**<img src="/assets/images/in-game/cerberus/mainmenu.png"> Main menu**
- `luiopenmenu customizemenu`
**<img src="/assets/images/in-game/cerberus/customizemenu.png"> Customization menu**
Unused leftover customization menu, sub-menus are inventory dependent.
- `luiopenmenu frontendcameramover`
**<img src="/assets/images/in-game/cerberus/frontendcameramover.png"> Frontend Camera Mover**
Camera control menu for frontend scenes.

## DVARs
Multi-purpose commands
-`setgamemode mp;xstartprivateparty;luiOpenMenu privatematchlobby;xstartlobby_patched`
Multiplayer private match trigger.
-`setgamemode zm;xstartprivateparty;luiOpenMenu zmpubliclobby;xstartlobby_patched`
Zombie match trigger.
- `r_dof_enable`
This will enable/disable depth of field (0-1)
- `lui_cod_points_enabled`
This will show/hide COD Points on menus (0-1)
