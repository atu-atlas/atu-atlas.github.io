## Menus
Useful & interesting menus
- `luiOpenMenu mainlockoutmenu`
**<img src="/assets/images/in-game/saturn/mainmenu.png"> Main menu**
- `luiopenmenu customizemenu`
**<img src="/assets/images/in-game/saturn/customizemenu.png"> Customization menu**
Unused leftover customization menu, sub-menus are inventory dependent.
- `luiopenmenu mybundleselect`
**<img src="/assets/images/in-game/saturn/mybundleselect.png"> Bundle locker menu**
Bundle list menu, inventory and version dependent.
- `luiopenmenu frontendcameramover`
**<img src="/assets/images/in-game/saturn/frontendcameramover.png"> Frontend Camera Mover**
Camera control menu for frontend scenes.
- `luiopenmenu relicselectmenu`
**<img src="/assets/images/in-game/saturn/relicselectmenu.png"> Relic select menu**
Relic selection menu, for Zombies cursed mode.

## DVARs
Multi-purpose commands
- `setgamemode mp;xstartprivateparty;luiOpenMenu privatematchlobby;xstartlobby_patched`
Multiplayer private match trigger.
- `r_dof_enable`
This will enable/disable depth of field (0-1)
- `lui_cod_points_enabled`
This will show/hide COD Points on menus (0-1)
- `set player_sustainammo 1`
Infinite ammo, 0-1, disabled by default.

## Inventories
- `setStorageFile sat_mp_loadouts_private loadouts 0 name`
Loadout name, ex: *setStorageFile sat_mp_loadouts_private loadouts 0 name "Fist of iron"*
- `setStorageFile sat_mp_loadouts_private loadouts 0 weaponSetups 0 weaponlootid`
Weapon setup, ex: *setStorageFile sat_mp_loadouts_private loadouts 0 weaponSetups 0 weaponlootid 88933*
- `setStorageFile sat_mp_loadouts_private loadouts 0 weaponSetups 0 camoLootID`
Weapon setup camouflage, ex: *setStorageFile sat_mp_loadouts_private loadouts 0 weaponSetups 0 camoLootID 105203*

## Zombies
<img src="/assets/images/key-art/BO7-Zombies.jpg">

*"Welcome... to the party."*

### DVARs
- `setgamemode zm;xstartprivateparty;luiOpenMenu zmpubliclobby;xstartlobby_patched`
Zombie match trigger.
- `setgametype`
Select a zombie game type.
- `uimapname`
Set the zombie map.
- `set zombie_cheat`
This will enable a developer cheat for all players with high value loot, depending on the number. Can be used once per weapon upgrade (0-3)
- `set enable_ee_headphones`
Enable/disable easter egg songs triggers 1-0, disabled by default.
- `set ammorestockcooldown`
Enable/disable ammo box cooldown, 0-1, disabled by default.

### Inventories
- `setStorageFile "sat_zm_loadouts" "loadouts" 0 "name"`
Loadout name, ex: *setStorageFile "sat_zm_loadouts" "loadouts" 0 "name" "Fist of iron"*
- `setStorageFile "sat_zm_loadouts" "loadouts" 0 "weaponSetups" 0 "weaponlootid"`
Weapon setup, ex: *setStorageFile "sat_zm_loadouts" "loadouts" 0 "weaponSetups" 0 "weaponlootid" 88933*
- `setStorageFile "sat_zm_loadouts" "loadouts" 0 "weaponSetups" 0 "camoLootID"`
Weapon setup camouflage, ex: *setStorageFile "sat_zm_loadouts" "loadouts" 0 "weaponSetups" 0 "camoLootID" 105203*
