## Menus
Useful & interesting menus
- `luiOpenMenu mainlockoutmenu`
**<img src="/assets/images/in-game/saturn/mainmenu.png"> Main menu**
- `luiopenmenu customizemenu`
**<img src="/assets/images/in-game/saturn/customizemenu.png"> Customization menu**
Unused leftover customization menu, sub-menus are inventory dependent.
- `luiopenmenu mybundleselect`
**<img src="/assets/images/in-game/saturn/mybundleselect.png"> Bundle locker menu**
Bundle list menu, inventory and version dependent.
- `luiopenmenu frontendcameramover`
**<img src="/assets/images/in-game/saturn/frontendcameramover.png"> Frontend Camera Mover**
Camera control menu for frontend scenes.

## DVARs
Multi-purpose commands
- `r_dof_enable`
This will enable/disable depth of field (0-1)
- `lui_cod_points_enabled`
This will show/hide COD Points on menus (0-1)

## Inventories
- `setStorageFile sat_mp_loadouts_private loadouts name`
Loadout name, ex: *setStorageFile sat_mp_loadouts_private loadouts name "Fist of iron"*
- `setStorageFile sat_mp_loadouts_private loadouts weaponSetups 0 weaponlootid`
Weapon setup, ex: *setStorageFile sat_mp_loadouts_private loadouts 0 weaponSetups 0 weaponlootid 88933*
- `setStorageFile sat_mp_loadouts_private loadouts weaponSetups 0 camoLootID`
Weapon setup camouflage, ex: *setStorageFile sat_mp_loadouts_private loadouts 0 weaponSetups 0 camoLootID 105203*
